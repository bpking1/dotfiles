version: '3'
services:
  dev:
    build: .
    container_name: dev-fd
    volumes:
      - /home/hj/workspace:/root/workspace
      - /home/hj/.config/fish:/root/.config/fish
      - /home/hj/.config/nvim:/root/.config/nvim
      - /home/hj/.config/tmux:/root/.config/tmux
      - /home/hj/.config/cliflux:/root/.config/cliflux
      - /vol1/@appdata/syncthing/obsidian-vault:/root/obsidian-vault
      - dev-plugins:/root/.local/share/nvim/site
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true
    restart: always
    ports:
      # syncthing
      #- "8384:8384"
      #- "22000:22000/tcp"
      #- "21027:21027/udp"
      # neovim
      - "3800:3800"

volumes:
  dev-plugins:
