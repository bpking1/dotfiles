# uosc 5.13.0 (自 4.7.0 迁移: 去掉已废弃键, *_fullscreen 尺寸类键并入 scale_fullscreen,
# 各元素 opacity/颜色并入 opacity=/color= 列表语法)

timeline_style=line
timeline_line_width=2
timeline_size=40
timeline_persistency=paused
timeline_border=1
timeline_step=5
timeline_cache=yes
# 原 timeline_size_min/line_width_minimized_scale → progress 元素
progress=windowed
progress_size=2
progress_line_width=20
# 原 *_fullscreen 尺寸(controls 40/32, volume 52/40, timeline 60/40)统一换算
scale_fullscreen=1.5
controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
volume=right
volume_size=40
volume_border=1
volume_step=1
speed_step=0.1
speed_step_is_factor=no
menu_item_height=36
menu_min_width=260
top_bar=no-border
top_bar_size=40
# 原 timeline_opacity/volume_opacity/speed_opacity/menu_opacity
opacity=timeline=0.9,volume=0.9,speed=0.6,menu=1
# 原 foreground_text/background/background_text
color=foreground_text=000000,background=000000,background_text=ffffff
font_bold=no
destination_time=playtime-remaining
time_precision=0
buffered_time_threshold=60
autohide=no
pause_indicator=flash
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
default_directory=~/
use_trash=no
adjust_osd_margins=yes
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80
chapter_range_patterns=openings:オープニング;endings:エンディング
