# hyprpaper 0.8+ 新版配置格式
# https://wiki.hypr.land/hypr-ecosystem/user/hyprpaper/

wallpaper {
    monitor = DP-1
    path = /home/hj/图片/wallpaper.jpg
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-1
    path = /home/hj/图片/wallpaper.jpg
    fit_mode = cover
}

# 兜底:未指定的显示器
wallpaper {
    monitor =
    path = /home/hj/图片/wallpaper.jpg
}

splash = false
